[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-watermark-remover"
version = "0.7.23"
description = "智能视频水印去除工具 - AI驱动的水印检测和去除应用"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
    {name = "", email = "noreply@anthropic.com"}
]
maintainers = [
    {name = "", email = "noreply@anthropic.com"}
]
keywords = [
    "watermark", "removal", "video", "image", "ai", "opencv",
    "computer-vision", "inpainting", "gui", "pyqt6", "batch-processing"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Topic :: Multimedia :: Video :: Conversion",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
    "Environment :: X11 Applications :: Qt",
]
dependencies = [
    "PyQt6>=6.6.0",
    "opencv-python>=4.8.0",
    "numpy>=1.25.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
full = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "torchaudio>=2.1.0",
    "onnx>=1.15.0",
    "onnxruntime>=1.16.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-qt>=4.2.0",
    "pytest-cov>=4.0.0",
    "black==23.12.1",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]

[project.urls]
"Homepage" = "https://github.com/Izumi0527/video_watermark_remover"
"Bug Reports" = "https://github.com/Izumi0527/video_watermark_remover/issues"
"Source" = "https://github.com/Izumi0527/video_watermark_remover"
"Documentation" = "https://github.com/Izumi0527/video_watermark_remover/tree/main/docs"

[project.scripts]
video-watermark-remover = "app.entrypoints:main"
vwr = "app.entrypoints:main"

[project.gui-scripts]
video-watermark-remover-gui = "app.entrypoints:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["app*"]

[tool.setuptools.package-data]
app = ["assets/*", "assets/icons/*"]

# Black代码格式化配置
[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # 排除目录
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

# isort导入排序配置
[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

# MyPy类型检查配置
[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "cv2.*",
    "PyQt6.*",
    "torch.*",
    "torchvision.*",
    "onnx.*",
    "onnxruntime.*",
    "numpy.*",
    "platformdirs.*",
]
ignore_missing_imports = true

# Pytest配置
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "cli: marks tests as CLI tool tests",
]

# Coverage配置
[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/test_*",
    "venv/*",
    ".venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

# Bandit安全检查配置
[tool.bandit]
targets = ["src/app", "main.py"]
exclude_dirs = [
    "tests",
    ".venv",
    "venv",
    "build",
    "dist",
]
skips = [
    # B404: 导入subprocess模块（用于FFmpeg调用）
    "B404",
    # B603: subprocess调用（已做参数验证）
    "B603",
]
severity_level = "medium"
