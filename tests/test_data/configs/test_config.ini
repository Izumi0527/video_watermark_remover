# 测试配置文件
# 智能视频水印去除工具 - 测试用配置

[DEFAULT]
# 基础设置
app_name = 智能视频水印去除工具
version = 3.0.0
debug = true

[video]
# 视频处理设置
supported_formats = mp4,avi,mov,mkv,wmv
default_quality = high
max_resolution = 1920x1080
fps_limit = 60

[ai]
# AI模型设置
model_type = pytorch
device = auto
batch_size = 1
confidence_threshold = 0.8
use_gpu = false

[audio]
# 音频处理设置
sample_rate = 44100
channels = 2
format = wav
bitrate = 192

[ui]
# 界面设置
theme = light
language = zh_CN
window_size = 1200x800
auto_save = true

[performance]
# 性能设置
max_memory_usage = 2048
thread_count = auto
cache_size = 512
temp_cleanup = true

[logging]
# 日志设置
level = INFO
file_output = true
console_output = true
max_file_size = 10MB
backup_count = 5
